<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>封面预览</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .cover-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .cover-container img {
      max-width: 100%;
      height: auto;
    }
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 4px;
    }
    .info p {
      margin: 8px 0;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div class="cover-container">
    <img src="https://oss.abp.top/wechat/aZUtvs1-HqFBsXyOTmXZG.svg" alt="文章封面">
    <div class="info">
      <p><strong>标题:</strong> 2026 年 AI 技术发展趋势：从大模型到智能体革命</p>
      <p><strong>主题:</strong> 科技感（tech）</p>
      <p><strong>尺寸:</strong> 900 x 500</p>
      <p><strong>格式:</strong> SVG</p>
      <p><strong>访问地址:</strong> <a href="https://oss.abp.top/wechat/aZUtvs1-HqFBsXyOTmXZG.svg" target="_blank">https://oss.abp.top/wechat/aZUtvs1-HqFBsXyOTmXZG.svg</a></p>
    </div>
  </div>
</body>
</html>
